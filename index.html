<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全网社交平台热点榜单</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #21252e;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --line: #2a2f3a;
    --accent: #ff5a5f;
    --accent2: #4f8cff;
    --ok: #2ecc71;
    --warn: #f1c40f;
    --wb: #e6162d; --zh: #0084ff; --dy: #161823; --bl: #fb7299; --xhs: #ff2741;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 18px 60px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 18px 22px; background: linear-gradient(135deg, #1c2030, #141925);
    border: 1px solid var(--line); border-radius: 16px; margin-bottom: 20px;
  }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  header.top .meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .badge.live { color: var(--ok); border-color: rgba(46,204,113,.4); }
  .badge.cache { color: var(--warn); border-color: rgba(241,196,15,.4); }
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--accent2); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-size: 13px;
    transition: transform .15s, opacity .15s;
  }
  .refresh-btn:hover { opacity: .9; }
  .refresh-btn:active { transform: scale(.96); }
  .refresh-btn.spin svg { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
  }
  .kpi .v { font-size: 30px; font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .kpi .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
  section.block { margin-top: 22px; }
  section.block > h2 { font-size: 17px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  section.block > h2::before { content: ""; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; display: inline-block; }
  .two-col { grid-template-columns: 1.3fr 1fr; }
  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }
  .chart-box { height: 300px; position: relative; }
  .insight { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.7; }
  .insight b { color: var(--text); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li {
    display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-bottom: 1px solid var(--line);
  }
  .list li:last-child { border-bottom: none; }
  .rank { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 7px; background: var(--card2);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--muted); }
  .rank.top { background: var(--accent); color: #fff; }
  .title { flex: 1; font-size: 14px; }
  .title a { color: var(--text); text-decoration: none; }
  .title a:hover { color: var(--accent2); }
  .heat { font-size: 13px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .ptag { font-size: 11px; padding: 2px 7px; border-radius: 6px; color: #fff; white-space: nowrap; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { cursor: pointer; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 13px; color: var(--muted); background: var(--card); }
  .tab.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .rate { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .rate.极速 { background: #ff5a5f; color: #fff; }
  .rate.爆发 { background: #ff9f43; color: #fff; }
  .rate.飙升 { background: #54a0ff; color: #fff; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.8; }
  .skeleton { color: var(--muted); }
  .banner { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 13px; display: none; }
  .banner.err { background: rgba(255,90,95,.12); border: 1px solid rgba(255,90,95,.4); color: #ff9a9d; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>🔥 全网社交平台热点榜单</h1>
      <div class="meta" style="margin-top:6px">
        <span id="updateTime">加载中…</span>
        <span id="sourceBadge" class="badge">—</span>
      </div>
    </div>
    <button class="refresh-btn" id="refreshBtn" title="立即刷新">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span>刷新</span>
    </button>
  </header>

  <div id="errBanner" class="banner err"></div>

  <!-- KPI -->
  <div class="grid kpis" id="kpis">
    <div class="card kpi"><div class="v" id="kpiTotal">—</div><div class="l">累计话题数</div></div>
    <div class="card kpi"><div class="v" id="kpiPlat">—</div><div class="l">覆盖平台数</div></div>
    <div class="card kpi"><div class="v" id="kpiMax">—</div><div class="l">最高热度值</div></div>
    <div class="card kpi"><div class="v" id="kpiNew">—</div><div class="l">24h 新增话题</div></div>
  </div>

  <!-- 数据分析 -->
  <section class="block">
    <h2>热点数据分析</h2>
    <div class="grid two-col">
      <div class="card">
        <strong style="font-size:14px">各平台热度对比</strong>
        <div class="chart-box"><canvas id="heatChart"></canvas></div>
      </div>
      <div class="card">
        <strong style="font-size:14px">话题类别分布</strong>
        <div class="chart-box"><canvas id="catChart"></canvas></div>
        <div class="insight" id="insight">—</div>
      </div>
    </div>
  </section>

  <!-- 跨平台综合十大 -->
  <section class="block">
    <h2>跨平台综合十大热点</h2>
    <div class="card">
      <ul class="list" id="overallList"><li class="skeleton">加载中…</li></ul>
    </div>
  </section>

  <!-- 分平台十大 -->
  <section class="block">
    <h2>分平台十大热点</h2>
    <div class="tabs" id="platTabs"></div>
    <div class="card">
      <ul class="list" id="platList"><li class="skeleton">请选择平台</li></ul>
    </div>
  </section>

  <!-- 24h 增长最快 -->
  <section class="block">
    <h2>24 小时增长最快十大</h2>
    <div class="card">
      <ul class="list" id="fastList"><li class="skeleton">加载中…</li></ul>
    </div>
  </section>

  <footer>
    数据聚合自微博、抖音、B站、百度、头条公开热榜接口 · 仅供趋势观察，不代表官方观点<br/>
    更新机制：点击右上角“刷新”按钮 → Cloudflare Worker 实时抓取（?fresh=1）；可选绑定 KV 缓存 / 可选 Cron 后台定时，全程仅用 Cloudflare
  </footer>
</div>

<script>
/* ============================================================
 * 配置区：把下面 WORKER_URL 改成你自己的 Cloudflare Worker 地址
 * （在 Cloudflare Workers 控制台 Deploy 后复制，形如 https://xxx.workers.dev）
 * 刷新方式：点击右上角“刷新”按钮 → 请求 Worker ?fresh=1 实时抓取最新数据。
 * 本版本为【纯手动刷新】：页面仅在首次加载时拉取一次，之后不再自动轮询，
 * 必须点击“刷新”按钮才会去 Cloudflare 抓取新数据。
 * （可选）如需无人访问时也自动更新，可在 Cloudflare 给 Worker 加 Cron 触发器，见 README。
 * ============================================================ */
const WORKER_URL = 'https://plain-hill-9dff.yanzhuzhou1996.workers.dev/';   // ← 你的 Cloudflare Worker 地址

const PLAT_ORDER = ['weibo', 'douyin', 'bilibili', 'baidu', 'toutiao'];
const PLAT_COLOR = { weibo: '#e6162d', douyin: '#161823', bilibili: '#fb7299', baidu: '#2932e1', toutiao: '#f04142' };
const PLAT_NAME  = { weibo: '微博', douyin: '抖音', bilibili: 'B站', baidu: '百度', toutiao: '头条' };

let heatChartObj = null, catChartObj = null;
let currentData = null;

function pcolor(key) { return PLAT_COLOR[key] || '#888'; }
function pname(key) { return PLAT_NAME[key] || key; }

function relTime(ts) {
  if (!ts) return '';
  const diff = Math.floor(Date.now() / 1000) - ts;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  return Math.floor(diff / 86400) + ' 天前';
}

async function fetchJSON(url, timeout = 12000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function loadData(fresh = false) {
  const btn = document.getElementById('refreshBtn');
  if (fresh) btn.classList.add('spin');
  hideErr();
  if (!WORKER_URL) {
    showErr('请在 index.html 顶部填写 WORKER_URL（你的 Cloudflare Worker 地址）。');
    if (fresh) btn.classList.remove('spin');
    return;
  }
  try {
    const data = await fetchJSON(WORKER_URL + (fresh ? '?fresh=1' : ''));
    if (data && data.error) throw new Error(data.error);
    currentData = data;
    render(data, fresh ? 'live' : 'cache');
  } catch (e) {
    showErr('数据加载失败：' + e.message + '（请确认 Worker 已部署、KV 已绑定、Cron 已配置）');
  }
  if (fresh) btn.classList.remove('spin');
}

function showErr(msg) {
  const b = document.getElementById('errBanner');
  b.textContent = msg; b.style.display = 'block';
}
function hideErr() { document.getElementById('errBanner').style.display = 'none'; }

function render(d, source) {
  // 顶部状态
  const tEl = document.getElementById('updateTime');
  const badge = document.getElementById('sourceBadge');
  tEl.innerHTML = `更新于 <b>${d.updateTime || '—'}</b>` + (d.updateTimestamp ? ` <span style="color:var(--muted)">(${relTime(d.updateTimestamp)})</span>` : '');
  if (source === 'live') { badge.textContent = '实时 · 手动刷新'; badge.className = 'badge live'; }
  else { badge.textContent = '缓存 · Cron 自动'; badge.className = 'badge cache'; }

  // KPI
  const s = d.summary || {};
  document.getElementById('kpiTotal').textContent = s.totalTopics ?? '—';
  document.getElementById('kpiPlat').textContent = s.platforms ?? '—';
  let maxHeat = 0;
  (d.overall || []).forEach(it => { if ((it.heatValue || 0) > maxHeat) maxHeat = it.heatValue; });
  document.getElementById('kpiMax').innerHTML = (maxHeat ? maxHeat : '—') + (maxHeat ? ' <small>万</small>' : '');
  document.getElementById('kpiNew').textContent = s.newTopics ?? '—';

  // 图表
  renderHeatChart(d.platformHeatStats || {});
  renderCatChart(d.categoryStats || {});

  // 洞察
  const plats = Object.keys(d.platforms || {}).map(pname).join('、') || '—';
  const top = (d.overall || [])[0];
  document.getElementById('insight').innerHTML =
    `今日共聚合 <b>${s.totalTopics ?? 0}</b> 条热点，覆盖 <b>${s.platforms ?? 0}</b> 个平台（${plats}）。` +
    (top ? `综合热度最高的话题是 <b>《${top.title}》</b>，热度约 <b>${top.heatText}</b>。` : '');

  // 跨平台综合十大
  const ol = document.getElementById('overallList');
  ol.innerHTML = '';
  (d.overall || []).forEach(it => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="rank ${it.rank <= 3 ? 'top' : ''}">${it.rank}</div>
      <div class="title">${it.title ? `<a href="${it.url || '#'}" target="_blank" rel="noopener">${it.title}</a>` : '—'}</div>
      <span class="ptag" style="background:${pcolor(it.platforms?.[0])}">${pname(it.platforms?.[0])}</span>
      <div class="heat">${it.heatText || '—'}</div>`;
    ol.appendChild(li);
  });
  if (!(d.overall || []).length) ol.innerHTML = '<li class="skeleton">暂无数据</li>';

  // 分平台 tab
  renderPlatTabs(d.platforms || {});

  // 24h 增长最快
  const fl = document.getElementById('fastList');
  fl.innerHTML = '';
  (d.fastestGrowing || []).forEach(it => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="rank ${it.rank <= 3 ? 'top' : ''}">${it.rank}</div>
      <div class="title">${it.title || '—'}</div>
      <span class="ptag" style="background:${pcolor(it.platforms?.[0])}">${pname(it.platforms?.[0])}</span>
      <span class="rate ${it.rate}">${it.rate}</span>`;
    fl.appendChild(li);
  });
  if (!(d.fastestGrowing || []).length) fl.innerHTML = '<li class="skeleton">暂无数据</li>';
}

function renderPlatTabs(platforms) {
  const tabs = document.getElementById('platTabs');
  tabs.innerHTML = '';
  const keys = PLAT_ORDER.filter(k => platforms[k]);
  if (!keys.length) { document.getElementById('platList').innerHTML = '<li class="skeleton">暂无数据</li>'; return; }
  keys.forEach((k, i) => {
    const el = document.createElement('div');
    el.className = 'tab' + (i === 0 ? ' active' : '');
    el.textContent = pname(k);
    el.onclick = () => {
      [...tabs.children].forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderPlatList(platforms[k]);
    };
    tabs.appendChild(el);
  });
  renderPlatList(platforms[keys[0]]);
}

function renderPlatList(pf) {
  const ul = document.getElementById('platList');
  ul.innerHTML = '';
  (pf.list || []).forEach(it => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="rank ${it.rank <= 3 ? 'top' : ''}">${it.rank}</div>
      <div class="title">${it.title ? `<a href="${it.url || '#'}" target="_blank" rel="noopener">${it.title}</a>` : '—'}</div>
      <div class="heat">${it.heatText || '—'}</div>`;
    ul.appendChild(li);
  });
  if (!(pf.list || []).length) ul.innerHTML = '<li class="skeleton">暂无数据</li>';
}

function renderHeatChart(stats) {
  const canvas = document.getElementById('heatChart');
  if (typeof Chart === 'undefined') { canvas.parentNode.innerHTML = '<div class="skeleton">图表库加载失败（可忽略，列表数据正常）</div>'; return; }
  const labels = PLAT_ORDER.filter(k => stats[k] != null).map(pname);
  const vals = PLAT_ORDER.filter(k => stats[k] != null).map(k => stats[k]);
  const colors = PLAT_ORDER.filter(k => stats[k] != null).map(pcolor);
  if (heatChartObj) heatChartObj.destroy();
  heatChartObj = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ label: '热度合计', data: vals, backgroundColor: colors, borderRadius: 6 }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#9aa0aa' }, grid: { color: '#2a2f3a' } }, y: { ticks: { color: '#9aa0aa' }, grid: { color: '#2a2f3a' } } } }
  });
}

function renderCatChart(cats) {
  const canvas = document.getElementById('catChart');
  if (typeof Chart === 'undefined') return;
  const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const palette = ['#ff5a5f', '#4f8cff', '#2ecc71', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#95a5a6'];
  if (catChartObj) catChartObj.destroy();
  catChartObj = new Chart(canvas, {
    type: 'doughnut',
    data: { labels: entries.map(e => e[0]), datasets: [{ data: entries.map(e => e[1]), backgroundColor: palette, borderColor: '#1a1d24', borderWidth: 2 }] },
    options: { plugins: { legend: { position: 'right', labels: { color: '#9aa0aa', boxWidth: 12 } } } }
  });
}

document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));
// 首次加载（仅此一次；之后请点击右上角"刷新"按钮获取最新数据）
loadData();
</script>
</body>
</html>
